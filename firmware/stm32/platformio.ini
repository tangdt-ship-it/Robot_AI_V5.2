[platformio]
default_envs = stm32_robot_v4_2

; Robot_AI_V4.2 production STM32 firmware.
; STM32 owns hard-real-time motion, encoder odometry, MPU6050/encoder Heading,
; PS2 arbitration and safety decisions.
[env:stm32_robot_v4_2]
platform = ststm32
board = genericSTM32F103VE
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
extra_scripts = post:tools/check_map_flash_layout.py
build_flags =
    -D ROBOT_DEBUG=1
    -D ROBOT_LINK_PHASE=3
    -D ROBOT_ENCODER_ENABLE=1
    -D ROBOT_IWDG_ENABLE=1
    -D STM32_LOCAL_MAP_ENABLE=1
    ; Correlated MOVE/TURN frames are longer than the Arduino core default
    ; 64-byte UART RX ring. Leave headroom for a frame plus heartbeat/telemetry
    ; timing so RobotLink commands cannot be dropped intermittently.
    -D SERIAL_RX_BUFFER_SIZE=256

; Compatibility alias for the V4.1 command line. It builds the same V4.2 code.
[env:stm32_robot_v4]
extends = env:stm32_robot_v4_2

; Wheel-speed PID commissioning candidate. Keep the chassis raised for the
; first run and tune PWM->mm/s and gains before any ground test or flash.
[env:stm32_robot_v4_2_wheel_pid]
extends = env:stm32_robot_v4_2
build_flags =
    -D ROBOT_DEBUG=1
    -D ROBOT_LINK_PHASE=3
    -D ROBOT_ENCODER_ENABLE=1
    -D ROBOT_IWDG_ENABLE=1
    -D STM32_LOCAL_MAP_ENABLE=1
    -D ROBOT_WHEEL_SPEED_PID_ENABLE=1

; Safe PS2 isolation probe. Motors remain stopped; only PS2 and RobotLink run.
[env:stm32_ps2_probe]
extends = env:stm32_robot_v4_2
build_unflags =
    -D ROBOT_IWDG_ENABLE=1
build_flags =
    -D ROBOT_DEBUG=1
    -D ROBOT_LINK_PHASE=3
    -D ROBOT_ENCODER_ENABLE=0
    -D ROBOT_IWDG_ENABLE=0
    -D ROBOT_PS2_PROBE=1

; Raised-wheel encoder validation. Use this before changing ticks/revolution.
[env:stm32_encoder_probe]
extends = env:stm32_robot_v4_2
build_unflags =
    -D ROBOT_IWDG_ENABLE=1
build_flags =
    -D ROBOT_DEBUG=1
    -D ROBOT_LINK_PHASE=3
    -D ROBOT_ENCODER_ENABLE=1
    -D ROBOT_IWDG_ENABLE=0
    -D ROBOT_ENCODER_PROBE=1

; MPU6050 commissioning build. It does not start PS2/RobotLink/motion control.
; Keep the chassis stationary for the initial gyro calibration.
[env:stm32_imu_probe]
extends = env:stm32_robot_v4_2
build_unflags =
    -D ROBOT_IWDG_ENABLE=1
build_flags =
    -D ROBOT_DEBUG=1
    -D ROBOT_LINK_PHASE=3
    -D ROBOT_ENCODER_ENABLE=1
    -D ROBOT_IWDG_ENABLE=0
    -D ROBOT_IMU_PROBE=1
