[platformio]
default_envs = stm32_robot_v4_2

; Robot_AI_V4.2 production STM32 firmware.
; STM32 owns hard-real-time motion, encoder odometry, MPU6050/Compass fusion,
; PS2 arbitration and safety decisions.
[env:stm32_robot_v4_2]
platform = ststm32
board = genericSTM32F103VE
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -D ROBOT_DEBUG=1
    -D ROBOT_LINK_PHASE=3
    -D ROBOT_ENCODER_ENABLE=1
    -D ROBOT_IWDG_ENABLE=1

; Compatibility alias for the V4.1 command line. It builds the same V4.2 code.
[env:stm32_robot_v4]
extends = env:stm32_robot_v4_2

; Safe PS2 isolation probe. Motors remain stopped; only PS2 and RobotLink run.
[env:stm32_ps2_probe]
extends = env:stm32_robot_v4_2
build_unflags =
    -D ROBOT_IWDG_ENABLE=1
build_flags =
    -D ROBOT_DEBUG=1
    -D ROBOT_LINK_PHASE=3
    -D ROBOT_ENCODER_ENABLE=0
    -D ROBOT_IWDG_ENABLE=0
    -D ROBOT_PS2_PROBE=1

; Raised-wheel diagnostic: deterministic motor/compass test. Watchdog is
; deliberately disabled because diagnostic pauses are not production timing.
[env:stm32_compass_motor_test]
extends = env:stm32_robot_v4_2
build_unflags =
    -D ROBOT_IWDG_ENABLE=1
build_flags =
    -D ROBOT_DEBUG=1
    -D ROBOT_LINK_PHASE=3
    -D ROBOT_ENCODER_ENABLE=1
    -D ROBOT_IWDG_ENABLE=0
    -D ROBOT_COMPASS_MOTOR_TEST=1

; Raised-wheel encoder validation. Use this before changing ticks/revolution.
[env:stm32_encoder_probe]
extends = env:stm32_robot_v4_2
build_unflags =
    -D ROBOT_IWDG_ENABLE=1
build_flags =
    -D ROBOT_DEBUG=1
    -D ROBOT_LINK_PHASE=3
    -D ROBOT_ENCODER_ENABLE=1
    -D ROBOT_IWDG_ENABLE=0
    -D ROBOT_ENCODER_PROBE=1

; MPU6050 commissioning build. It does not start PS2/RobotLink/motion control.
; Keep the chassis stationary for the initial gyro calibration.
[env:stm32_imu_probe]
extends = env:stm32_robot_v4_2
build_unflags =
    -D ROBOT_IWDG_ENABLE=1
build_flags =
    -D ROBOT_DEBUG=1
    -D ROBOT_LINK_PHASE=3
    -D ROBOT_ENCODER_ENABLE=1
    -D ROBOT_IWDG_ENABLE=0
    -D ROBOT_IMU_PROBE=1
